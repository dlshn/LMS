$kind: http-request
url: "{{baseUrl}}/api/auth/student/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{studentUsername}}",
      "password": "{{studentPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const data = pm.response.json();
        pm.collectionVariables.set('studentAccessToken', data.accessToken);
        pm.collectionVariables.set('studentRefreshToken', data.refreshToken);
        pm.collectionVariables.set('studentId', data.student.id);
      }
    language: text/javascript
order: 4000
