$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tuitionClassName": "Sample Tuition Class",
      "adminName": "Jane Admin",
      "email": "admin@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.collectionVariables.set('accessToken', data.accessToken);
        pm.collectionVariables.set('refreshToken', data.refreshToken);
        pm.collectionVariables.set('tuitionClassId', data.tuitionClass.id);
      }
    language: text/javascript
order: 1000
