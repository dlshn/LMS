$kind: http-request
url: "{{baseUrl}}/api/attendance"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "studentId": "{{studentId}}",
      "date": "2026-08-07",
      "status": "PRESENT"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
